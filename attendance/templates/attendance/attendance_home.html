{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>

BTES Attendance Portal

</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap"
      rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#03060f;

    overflow:hidden;

    color:#8fdcff;

    font-family:'Orbitron',sans-serif;

}

/*------------------------------------------------*/

.background-grid{

    position:fixed;

    inset:0;

    background-image:
        linear-gradient(rgba(0,180,255,.08) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,180,255,.08) 1px,transparent 1px);

    background-size:40px 40px;

    animation:gridMove 12s linear infinite;

    z-index:-10;

}

@keyframes gridMove{

    from{

        background-position:0 0;

    }

    to{

        background-position:40px 40px;

    }

}

/*------------------------------------------------*/

.header{

    text-align:center;

    padding-top:25px;

}

.header h1{

    font-size:48px;

    color:#00d8ff;

    letter-spacing:8px;

    text-shadow:

        0 0 10px #00d8ff,

        0 0 30px #00d8ff,

        0 0 60px #00d8ff;

    animation:headerGlow 2s infinite alternate;

}

@keyframes headerGlow{

    from{

        text-shadow:

        0 0 8px #00d8ff,

        0 0 20px #00d8ff;

    }

    to{

        text-shadow:

        0 0 20px cyan,

        0 0 60px cyan,

        0 0 100px cyan;

    }

}

.header h3{

    margin-top:10px;

    color:white;

    font-weight:400;

    letter-spacing:5px;

}

/*------------------------------------------------*/

.container{

    width:100vw;

    height:calc(100vh - 120px);

    display:flex;

    justify-content:center;

    align-items:center;

}

/*------------------------------------------------*/

.left-panel{

    width:70%;

    display:flex;

    justify-content:center;

}

/*------------------------------------------------*/

.camera-box{

    width:900px;

    height:600px;

    position:relative;

    overflow:hidden;

    border-radius:20px;

    border:2px solid #00d8ff;

    background:black;

    animation:borderPulse 2s infinite;

}

@keyframes borderPulse{

    0%{

        box-shadow:

        0 0 20px #00d8ff,

        inset 0 0 15px rgba(0,216,255,.15);

    }

    50%{

        box-shadow:

        0 0 45px cyan,

        inset 0 0 35px rgba(0,216,255,.35);

    }

    100%{

        box-shadow:

        0 0 20px #00d8ff,

        inset 0 0 15px rgba(0,216,255,.15);

    }

}

/*------------------------------------------------*/

#video{

    width:100%;

    height:100%;

    object-fit:cover;

    background:black;

}

#freezeCanvas{

    width:100%;

    height:100%;

    display:none;

}

#captureCanvas{

    display:none;

}

/*------------------------------------------------*/

.corner{

    position:absolute;

    width:70px;

    height:70px;

    border:4px solid cyan;

    animation:hudPulse 1.6s infinite;

}

@keyframes hudPulse{

    0%{

        opacity:.4;

        transform:scale(.95);

    }

    50%{

        opacity:1;

        transform:scale(1);

    }

    100%{

        opacity:.4;

        transform:scale(.95);

    }

}

.tl{

    top:15px;

    left:15px;

    border-right:none;

    border-bottom:none;

}

.tr{

    top:15px;

    right:15px;

    border-left:none;

    border-bottom:none;

}

.bl{

    bottom:15px;

    left:15px;

    border-right:none;

    border-top:none;

}

.br{

    bottom:15px;

    right:15px;

    border-left:none;

    border-top:none;

}

/*------------------------------------------------*/

.scan-line{

    position:absolute;

    left:0;

    width:100%;

    height:6px;

    background:

    linear-gradient(

        to bottom,

        transparent,

        cyan,

        white,

        cyan,

        transparent

    );

    filter:blur(1px);

    animation:scanner 3s linear infinite;

}

@keyframes scanner{

    0%{

        top:-20px;

    }

    100%{

        top:100%;

    }

}

@keyframes scan{

    from{

        top:0;

    }

    to{

        top:100%;

    }

}

/*------------------------------------------------*/

.right-panel{

    width:30%;

    padding:40px;

}

/*------------------------------------------------*/

.ai-card{

    border:2px solid cyan;

    border-radius:25px;

    padding:35px;

    background:

    linear-gradient(

        180deg,

        rgba(0,35,65,.5),

        rgba(0,10,20,.7)

    );

    backdrop-filter:blur(6px);

    box-shadow:

        0 0 40px rgba(0,216,255,.25),

        inset 0 0 20px rgba(0,216,255,.15);

}

/*------------------------------------------------*/

.ai-avatar{

    font-size:150px;

    text-align:center;

    color:#00d8ff;

    animation:avatarFloat 3s ease-in-out infinite;

}

@keyframes avatarFloat{

    0%{

        transform:translateY(0px);

    }

    50%{

        transform:translateY(-12px);

    }

    100%{

        transform:translateY(0px);

    }

}

@keyframes pulse{

    0%{

        transform:scale(.95);

        opacity:.7;

    }

    50%{

        transform:scale(1.05);

        opacity:1;

    }

    100%{

        transform:scale(.95);

        opacity:.7;

    }

}

/*------------------------------------------------*/

.status-title{

    margin-top:20px;

    text-align:center;

    font-size:28px;

    color:white;

}

.status-text{

    margin-top:20px;

    text-align:center;

    font-size:18px;

    color:#bcefff;

    letter-spacing:2px;

    animation:statusBlink 1.3s infinite;

}

@keyframes statusBlink{

    0%{

        opacity:.4;

    }

    50%{

        opacity:1;

    }

    100%{

        opacity:.4;

    }

}

/*------------------------------------------------*/

.progress-container{

    margin-top:30px;

    width:100%;

    height:12px;

    border-radius:10px;

    overflow:hidden;

    border:1px solid #00d8ff;

}

.progress{

    width:0;

    height:100%;

    background:

    linear-gradient(

        90deg,

        cyan,

        white,

        cyan

    );

    box-shadow:

        0 0 20px cyan;

}

/*------------------------------------------------*/

.footer-status{

    position:absolute;

    bottom:25px;

    width:100%;

    text-align:center;

    color:white;

    letter-spacing:5px;

    animation:footerFlash 1.5s infinite;

}

@keyframes footerFlash{

    0%{

        opacity:.3;

    }

    50%{

        opacity:1;

    }

    100%{

        opacity:.3;

    }

}

/*=============================
RADAR
==============================*/

.radar{

position:relative;

width:260px;

height:260px;

margin:auto;

display:flex;

justify-content:center;

align-items:center;

}

/*=============================*/

.ring{

position:absolute;

border:2px solid cyan;

border-radius:50%;

animation:expand 3s linear infinite;

opacity:.5;

}

.ring1{

width:90px;

height:90px;

}

.ring2{

width:160px;

height:160px;

animation-delay:1s;

}

.ring3{

width:240px;

height:240px;

animation-delay:2s;

}

@keyframes expand{

0%{

transform:scale(.85);

opacity:.8;

}

100%{

transform:scale(1.1);

opacity:.15;

}

}

/*=============================*/

.center-dot{

position:absolute;

width:14px;

height:14px;

background:cyan;

border-radius:50%;

box-shadow:

0 0 15px cyan,

0 0 30px cyan;

}

/*=============================*/

.ai-icon{

position:absolute;

font-size:120px;

color:#00d8ff;

z-index:20;

animation:floatAI 3s ease-in-out infinite;

}

@keyframes floatAI{

0%{

transform:translateY(0px);

}

50%{

transform:translateY(-8px);

}

100%{

transform:translateY(0px);

}

}

/*=============================*/

.scanner-arm{

position:absolute;

width:3px;

height:120px;

background:cyan;

transform-origin:bottom center;

animation:rotateScanner 4s linear infinite;

box-shadow:0 0 20px cyan;

}

@keyframes rotateScanner{

from{

transform:rotate(0deg);

}

to{

transform:rotate(360deg);

}

}

/*=============================*/

.camera-overlay{

position:absolute;

inset:0;

pointer-events:none;

background:

linear-gradient(

transparent 96%,

rgba(0,255,255,.05)

);

background-size:100% 8px;

opacity:.4;

animation:overlayMove .3s linear infinite;

}

@keyframes overlayMove{

from{

background-position:0 0;

}

to{

background-position:0 8px;

}

}

/*=============================*/

.camera-vignette{

position:absolute;

inset:0;

pointer-events:none;

box-shadow:

inset 0 0 180px rgba(0,0,0,.65);

}

/*=============================*/

.hud-top-left,

.hud-top-right,

.hud-bottom-left,

.hud-bottom-right{

position:absolute;

font-size:12px;

letter-spacing:2px;

color:#00d8ff;

background:rgba(0,0,0,.5);

padding:6px 10px;

border:1px solid cyan;

}

.hud-top-left{

top:15px;

left:90px;

}

.hud-top-right{

top:15px;

right:90px;

}

.hud-bottom-left{

bottom:15px;

left:90px;

}

.hud-bottom-right{

bottom:15px;

right:90px;

}

.system-panel{

margin-top:40px;

font-size:13px;

letter-spacing:2px;

border-top:1px solid rgba(0,255,255,.2);

padding-top:20px;

line-height:32px;

color:#7ee8ff;

}

.system-panel hr{

border-color:rgba(0,255,255,.15);

}

#countdown{

position:absolute;

top:50%;

left:50%;

transform:translate(-50%,-50%);

font-size:180px;

font-weight:bold;

color:white;

display:none;

text-shadow:

0 0 20px cyan,

0 0 60px cyan;

animation:pulseCountdown 1s infinite;

z-index:100;

}

@keyframes pulseCountdown{

0%{

transform:translate(-50%,-50%) scale(.9);

}

50%{

transform:translate(-50%,-50%) scale(1.1);

}

100%{

transform:translate(-50%,-50%) scale(.9);

}

}

/*----------------------------------*/
/* FACE TARGET BOX */
/*----------------------------------*/

#faceBox{

position:absolute;

width:220px;

height:280px;

border:3px solid #00d8ff;

border-radius:20px;

left:50%;

top:50%;

transform:translate(-50%,-50%);

box-shadow:

0 0 25px cyan,

inset 0 0 20px cyan;

animation:targetPulse 1.5s infinite;

pointer-events:none;

}

@keyframes targetPulse{

0%{

opacity:.5;

transform:translate(-50%,-50%) scale(.98);

}

50%{

opacity:1;

transform:translate(-50%,-50%) scale(1);

}

100%{

opacity:.5;

transform:translate(-50%,-50%) scale(.98);

}

}

/*----------------------------------*/

#scannerCircle{

position:absolute;

width:260px;

height:260px;

left:50%;

top:50%;

transform:translate(-50%,-50%);

border-radius:50%;

border:2px solid cyan;

animation:rotateScanner 5s linear infinite;

opacity:.5;

}

/*----------------------------------*/

#scannerGlow{

position:absolute;

left:50%;

top:50%;

transform:translate(-50%,-50%);

width:260px;

height:260px;

border-radius:50%;

box-shadow:

0 0 60px cyan,

0 0 120px cyan;

opacity:.25;

}

/*----------------------------------*/

.target-h{

position:absolute;

left:0;

right:0;

top:50%;

height:1px;

background:cyan;

opacity:.35;

}

.target-v{

position:absolute;

top:0;

bottom:0;

left:50%;

width:1px;

background:cyan;

opacity:.35;

}

/*----------------------------------*/

.scan-grid{

position:absolute;

inset:0;

background-image:

linear-gradient(rgba(0,255,255,.08) 1px,transparent 1px),

linear-gradient(90deg,rgba(0,255,255,.08) 1px,transparent 1px);

background-size:30px 30px;

pointer-events:none;

}

</style>

</head>

<body>

<div class="background-grid"></div>

<div class="header">

<h1>

BTES ATTENDANCE PORTAL

</h1>

</div>

<div class="container">

<div class="left-panel">

<div class="camera-box">

<div class="camera-overlay"></div>

</div>

<div class="hud-top-right">

</div>

<div class="hud-bottom-left">
    HD 1080P
</div>

<div class="hud-bottom-right">

</div>

<div class="camera-vignette"></div>

<video
id="video"
autoplay
playsinline>
</video>

<div id="faceBox"></div>

<div id="scannerGlow"></div>

<div class="target-v"></div>

<div class="scan-grid"></div>

<canvas id="captureCanvas"></canvas>

<div class="corner tr"></div>

<div class="corner bl"></div>

<div class="corner br"></div>

<div class="footer-status">

ALIGN YOUR FACE WITHIN THE FRAME

</div>

3

</div>

</div>

</div>

</div>

</div>

</div>

</div>

<div>

READY

</div>

<hr>

<div>

DATABASE

</div>

<div>

CONNECTED

</div>

MATCH STATUS

</div>

</div>

</div>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js"></script>

<script>

let faceDetected=false;

let faceStableCounter=0;

let detector;

const video=document.getElementById("video");

const freezeCanvas=document.getElementById("freezeCanvas");

const captureCanvas=document.getElementById("captureCanvas");

const statusText=document.getElementById("statusText");

const progressBar=document.getElementById("progressBar");

const countdown=document.getElementById("countdown");

const matchStatus=document.getElementById("matchStatus");

let stream=null;

let scanning=false;

async function startCamera(){

try{

stream=await navigator.mediaDevices.getUserMedia({

video:true

});

video.srcObject=stream;

video.onloadedmetadata=function(){

    initializeFaceDetection();

}

statusText.innerHTML="Waiting For Face...";

autoDetect();

}

catch{

statusText.innerHTML="Camera Error";

}

}

startCamera();

function autoDetect(){

setTimeout(function(){

if(scanning) return;

startCountdown();

},2500);

}

function startCountdown(){

if(faceStableCounter==0){

clearInterval(timer);

countdown.style.display="none";

statusText.innerHTML="Searching For Face...";

scanning=false;

return;

}

scanning=true;

let seconds=3;

countdown.style.display="block";

countdown.innerHTML=seconds;

statusText.innerHTML="Face Detected";

const timer=setInterval(function(){

seconds--;

countdown.innerHTML=seconds;

if(seconds===0){

clearInterval(timer);

countdown.style.display="none";

captureFrame();

}

},1000);

}

function captureFrame(){

captureCanvas.width=video.videoWidth;

captureCanvas.height=video.videoHeight;

captureCanvas.getContext("2d").drawImage(

video,

0,

0

);

freezeCanvas.width=captureCanvas.width;

freezeCanvas.height=captureCanvas.height;

freezeCanvas.getContext("2d").drawImage(

captureCanvas,

0,

0

);

video.style.display="none";

freezeCanvas.style.display="block";

fakeAI();

}

async function fakeAI(){

const steps=[

"LOCKING TARGET",

"EXTRACTING FEATURES",

"GENERATING EMBEDDING",

"MATCHING DATABASE",

"CALCULATING CONFIDENCE",

"AUTHENTICATING USER"

];

progressBar.style.width="0%";

for(let i=0;i<steps.length;i++){

statusText.innerHTML=`

<div style="font-size:18px">

${steps[i]}

</div>

<div style="margin-top:20px">

████████████████████

</div>

`;

matchStatus.innerHTML=steps[i];

progressBar.style.width=((i+1)/steps.length)*100+"%";

await sleep(900);

}

sendAttendance();

}

function sleep(ms){

return new Promise(resolve=>setTimeout(resolve,ms));

}

async function sendAttendance(){

    const image = captureCanvas.toDataURL("image/png");

    try{

        const response = await fetch("",{

            method:"POST",

            headers:{

                "X-CSRFToken":"{{ csrf_token }}",

                "Content-Type":"application/x-www-form-urlencoded"

            },

            body:new URLSearchParams({

                image:image

            })

        });

        const data = await response.json();

        if(data.success){

            statusText.innerHTML=`

<div style="font-size:26px;color:#00ff88">

✔ VERIFIED

</div>

<br>

<div style="font-size:22px">

${data.student}

</div>

<br>

Confidence

${data.confidence}%

`;

            matchStatus.innerHTML = "VERIFIED";

        }

        else{

            statusText.innerHTML = `
                <span style="color:#ff4444;font-size:24px;">
                    ✖ ${data.message}
                </span>
            `;

            matchStatus.innerHTML = "FAILED";

        }

        setTimeout(resetScanner,3000);

    }

    catch(error){

        statusText.innerHTML = "Server Error";

        matchStatus.innerHTML = "ERROR";

        setTimeout(resetScanner,3000);

    }

}

function resetScanner(){

freezeCanvas.style.display="none";

video.style.display="block";

progressBar.style.width="0%";

matchStatus.innerHTML="WAITING";

statusText.innerHTML="Waiting For Face...";

countdown.style.display="none";

scanning=false;

autoDetect();

}

function initializeFaceDetection(){

detector=new FaceDetection({

locateFile:(file)=>{

return `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`;

}

});

detector.setOptions({

model:"short",

minDetectionConfidence:.75

});

detector.onResults(onFaceResults);

const camera=new Camera(video,{

onFrame:async()=>{

await detector.send({

image:video

});

},

width:640,

height:480

});

camera.start();

}

function onFaceResults(results){

if(scanning)

return;

if(results.detections.length>0){

statusText.innerHTML="LOCKING FACE";

faceBox.style.borderColor="#ffcc00";

matchStatus.innerHTML="FACE FOUND";

faceStableCounter++;

if(faceStableCounter>=25){

startCountdown();

}

}

else{

statusText.innerHTML="Searching For Face...";

matchStatus.innerHTML="WAITING";

faceStableCounter=0;

}

}

</script>

</body>
